spring.application.name = SpringSecurityApp
spring.mvc.hiddenmethod.filter.enabled=true
spring.datasource.url = jdbc:postgresql://localhost:5432/userdb?useSSL=false&serverTimezone=Europe/Moscow
spring.datasource.username = postgres
spring.datasource.password = postgres

spring.jpa.hibernate.ddl-auto = create
spring.jpa.properties.hibernate.dialect = org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.show_sql= true

app.default.role=ROLE_USER
app.admin.role=ROLE_ADMIN
app.defaultadmin.username = admin
app.defaultadmin.password = admin
