<!DOCTYPE html>
<html xmlns:th="http://thymeleaf.org"
      lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Профиль пользователя</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #f5f5f5;
        }
        .container {
            text-align: center;
            background: white;
            padding: 40px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            min-width: 320px;
        }
        .info-block {
            text-align: left;
            margin: 20px 0 30px 0;
            padding: 15px;
            background-color: #f9f9f9;
            border-radius: 6px;
            border-left: 4px solid #007bff;
        }
        .info-item {
            margin-bottom: 10px;
            font-size: 16px;
            color: #333;
        }
        .info-item strong {
            color: #555;
        }
        .role-badge {
            display: inline-block;
            background-color: #e2e8f0;
            color: #4a5568;
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 14px;
            margin-right: 5px;
            font-weight: bold;
        }
        .btn-logout {
            display: inline-block;
            width: 100%;
            padding: 12px 0;
            font-size: 16px;
            color: white;
            background-color: #dc3545; /* Красный цвет для выхода */
            border: none;
            border-radius: 4px;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        .btn-logout:hover {
            background-color: #bd2130;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Профиль пользователя</h1>

    <div class="info-block">
        <div class="info-item">
            <strong>Имя:</strong> <span th:text="${user.name}">Имя</span>
        </div>

        <div class="info-item">
            <strong>Возраст:</strong> <span th:text="${user.age}">0</span>
        </div>

        <div class="info-item">
            <strong>Роли:</strong>
            <th:block th:each="role : ${user.roles}">
                <!-- Изменено: th:switch теперь использует поле .name объекта Role -->
                <span th:switch="${role.name}" class="role-badge">
                    <span th:case="'ROLE_ADMIN'">Администратор</span>
                    <span th:case="'ROLE_USER'">Пользователь</span>
                </span>
            </th:block>
        </div>
    </div> <!-- Исправлено закрытие блока info-block -->

    <form th:action="@{/logout}" method="post">
        <button type="submit" class="btn-logout">Выйти из системы</button>
    </form>
</div>

</body>
</html>
