<!DOCTYPE html>
<html xmlns:th="http://thymeleaf.org"
      lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Редактирование пользователя</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      background-color: #f5f5f5;
    }
    .container {
      background: white;
      padding: 40px;
      border-radius: 8px;
      box-shadow: 0 4px 6px rgba(0,0,0,0.1);
      width: 100%;
      max-width: 400px;
      box-sizing: border-box;
    }
    h1 {
      text-align: center;
      margin-bottom: 25px;
      font-size: 24px;
      color: #333;
    }
    .form-group {
      margin-bottom: 20px;
    }
    .form-group label {
      display: block;
      margin-bottom: 8px;
      font-weight: bold;
      color: #555;
    }
    .form-control {
      width: 100%;
      padding: 10px;
      font-size: 16px;
      border: 1px solid #ccc;
      border-radius: 4px;
      box-sizing: border-box;
    }
    .checkbox-group {
      display: flex;
      flex-direction: column;
      gap: 10px;
      background-color: #f9f9f9;
      padding: 12px;
      border-radius: 6px;
      border: 1px solid #e2e8f0;
    }
    .checkbox-item {
      display: flex;
      align-items: center;
      cursor: pointer;
    }
    .checkbox-item input {
      margin-right: 10px;
      width: 18px;
      height: 18px;
      cursor: pointer;
    }
    .btn-submit {
      display: block;
      width: 100%;
      padding: 12px;
      font-size: 16px;
      color: white;
      background-color: #007bff;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      transition: background-color 0.2s;
      font-weight: bold;
      margin-top: 25px;
    }
    .btn-submit:hover {
      background-color: #0056b3;
    }
    .logout-container {
      margin-top: 20px;
      text-align: center;
      border-top: 1px solid #eee;
      padding-top: 15px;
    }
    .btn-logout {
      display: inline-block;
      width: 100%;
      padding: 12px 0;
      font-size: 16px;
      color: white;
      background-color: #dc3545;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      transition: background-color 0.2s;
    }
    .btn-logout:hover {
      background-color: #bd2130;
    }
  </style>
</head>
<body>

<div class="container">
  <h1>Редактировать пользователя</h1>

  <form th:action="@{/admin/users/{id}(id=${user.id})}" th:object="${user}" method="post">

    <!-- ТРЮК ДЛЯ THYMELEAF: Скрытое поле превращает POST-запрос браузера в настоящий HTTP PUT-запрос -->
    <input type="hidden" name="_method" value="PUT"/>

    <input type="hidden" th:field="*{id}" />

    <div class="form-group">
      <label for="name">Имя:</label>
      <input type="text" id="name" th:field="*{name}" class="form-control"
             placeholder="Введите имя" required />
    </div>

    <div class="form-group">
      <label for="age">Возраст:</label>
      <input type="number" id="age" th:field="*{age}" class="form-control"
             placeholder="Пример: 25" min="1" max="120" required />
    </div>

    <div class="form-group">
      <label>Роли:</label>
      <div class="checkbox-group">
        <label class="checkbox-item">
          <input type="checkbox" th:field="*{roles}" value="ROLE_USER" />
          <span>Пользователь</span>
        </label>
        <label class="checkbox-item">
          <input type="checkbox" th:field="*{roles}" value="ROLE_ADMIN" />
          <span>Администратор</span>
        </label>
      </div>
    </div>

    <button type="submit" class="btn-submit">Изменить</button>

  </form>

  <div class="logout-container">
    <form th:action="@{/logout}" method="post">
      <button type="submit" class="btn-logout">Выйти из системы</button>
    </form>
  </div>
</div>

</body>
</html>
